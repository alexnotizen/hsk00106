<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 6 – NGỮ PHÁP - Flashcard</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#fdfbf7;
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(860px,96vw); padding:30px 0 40px}
h1{text-align:center;margin:0 0 15px;font-size:32px; font-weight: bold;}
.progress{text-align:center;font-size:18px;color:#444;margin-bottom:20px; font-weight: bold;}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:592px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 15px 45px rgba(0,0,0,.15);
  display:flex; flex-direction:column; padding:36px; border:3px solid #eee; overflow-y:auto;
}
.front{justify-content:flex-start; align-items:flex-start; text-align:left}
.back{transform:rotateY(180deg); text-align:left; align-items:flex-start; justify-content:flex-start; padding-top:40px;}

.hl{color: #7c2d12; font-weight: bold; background-color: #fef08a; padding: 2px 6px; border-radius: 4px; border: 1px solid #eab308;}
.hl-blue { color: #ffffff; font-weight: bold; background-color: #2563eb; padding: 2px 6px; border-radius: 4px; }
.hl-red { color: #dc2626; font-weight: bold; }

.pinyin{
  font-size:1.55em;
  color:#666666;
  margin-bottom:12px;
  font-weight:bold;
  text-align:center;
  width:100%;
}

.zh-front { font-size: 2em; font-weight: bold; margin-bottom: 8px; line-height: 1.3; color: #dc2626; text-align: center; width: 100%; }

.zh-back { color: #2563eb; font-weight: bold; font-size: 1.65em; line-height: 1.2; display: inline-block; margin-top: 10px; margin-bottom: 2px; }
.pinyin-back { color: #666666; font-weight: bold; font-size: 1.05em; display: block; margin: 2px 0; }
.vi-back { font-size: 1.05em; color: #333; display: block; margin-bottom: 14px; }

.desc-front { font-size: 1.2em; color: #333; margin: 12px 0; text-align: left; width: 100%; line-height: 1.5; }
.desc{font-size: 1.3em; color: #333; margin: 0; text-align: left; width: 100%; line-height: 1.45;}

.controls{display:flex;gap:20px;justify-content:center;margin-top:30px}
button{
  border:0;border-radius:20px;padding:20px 35px;font-size:22px;
  cursor:pointer;background:#e9eef7;color:#233044; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1);
}
button.primary{background:#2563eb;color:white}
</style>
</head>

<body>
<div class="app">
  <h1 id="title">BÀI 6 – NGỮ PHÁP</h1>
  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front" id="frontFace"></div>
      <div class="face back" id="backFace"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← TRƯỚC</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">LẬT THẺ</button>
    <button onclick="event.stopPropagation();nextCard()">TIẾP →</button>
  </div>
</div>

<script>
const cards = [
  {
    f: "<div style='text-align:center; width:100%; font-size:1.6em; font-weight:bold; margin-bottom:5px;'>CÁCH NÓI: TÔI MUỐN ĐI SIÊU THỊ</div>" +
       "<div class='zh-front'>我想去超市</div>" +
       "<div class='pinyin'>Wǒ xiǎng qù chāoshì</div>" +
       "<div class='desc-front' style='font-size: 1.2em;'>" +
       "<b>Muốn: <span class='hl-red'>想 + hành động</span></b><br>" +
       "<b>Không muốn: <span class='hl-red'>不想 + hành động</span></b>" +
       "</div>",
    b: "<div class='desc' style='line-height:1.5;'>" +
       "<span class='zh-back'>我想去超市。</span><br><span class='pinyin-back'>Wǒ xiǎng qù chāoshì.</span><span class='vi-back'>(Tôi muốn đi siêu thị.)</span>" +
       "<span class='zh-back'>我哥哥不想休息。</span><br><span class='pinyin-back'>Wǒ gēge bù xiǎng xiūxi.</span><span class='vi-back'>(Anh trai tôi không muốn nghỉ ngơi.)</span>" +
       "<span class='zh-back'>她不想做面条。</span><br><span class='pinyin-back'>Tā bù xiǎng zuò miàntiáo.</span><span class='vi-back'>(Cô ta không muốn nấu mì.)</span>" +
       "</div>"
  },
  {
    f: "<div style='text-align:center; width:100%; font-size:1.6em; font-weight:bold; margin-bottom:5px;'>TÔI ĐI SIÊU THỊ MUA ĐỒ</div>" +
       "<div class='zh-front'>我去超市买东西</div>" +
       "<div class='pinyin'>Wǒ qù chāoshì mǎi dōngxi</div>" +
       "<div class='desc-front' style='font-size: 1.2em;'>" +
       "<b><span class='hl-red'>Chủ thể + 去 + nơi chốn + hành động</span></b>" +
       "</div>",
    b: "<div class='desc' style='line-height:1.4;'>" +
       "<span class='zh-back'>我们去西安饭店吃晚饭。</span><br><span class='pinyin-back'>Wǒmen qù Xī'ān fàndiàn chī wǎnfàn.</span><span class='vi-back'>(Chúng tôi đi nhà hàng Tây An ăn tối.)</span>" +
       "<span class='zh-back'>我想去超市买包子和水饺。</span><br><span class='pinyin-back'>Wǒ xiǎng qù chāoshì mǎi bāozi hé shuǐjiǎo.</span><span class='vi-back'>(Tôi muốn đi siêu thị mua bánh bao và sủi cảo.)</span>" +
       "<span class='zh-back'>晚上我去你家吃饭。</span><br><span class='pinyin-back'>Wǎnshang wǒ qù nǐ jiā chī fàn.</span><span class='vi-back'>(Buổi tối tôi đến nhà bạn ăn cơm.)</span>" +
       "<span class='zh-back'>有时候去图书馆学习。</span><br><span class='pinyin-back'>Yǒushíhou qù túshūguǎn xuéxí.</span><span class='vi-back'>(Có lúc đến thư viện để học.)</span>" +
       "</div>"
  },
  {
    f: "<div style='text-align:center; width:100%; font-size:1.6em; font-weight:bold; margin-bottom:5px;'>TÔI ĐI TAXI ĐẾN NHÀ HÀNG</div>" +
       "<div class='zh-front'>我<span class='hl-blue'>坐</span>出租车去饭店</div>" +
       "<div class='pinyin'>Wǒ zuò chūzūchē qù fàndiàn</div>" +
       "<div class='desc-front' style='font-size: 1.25em;'>" +
       "Khi đi các phương tiện có mái che như tàu, ô tô, máy bay, ta sẽ dùng từ <b><span class='hl-red'>坐</span></b>." +
       "</div>",
    b: "<div class='desc' style='line-height:1.5;'>" +
       "<span class='zh-back'>我妈妈坐出租车去买东西。</span><br><span class='pinyin-back'>Wǒ māma zuò chūzūchē qù mǎi dōngxi.</span><span class='vi-back'>(Mẹ tôi đi taxi đi mua đồ.)</span>" +
       "</div>"
  },
  {
    f: "<div style='text-align:center; width:100%; font-size:1.6em; font-weight:bold; margin-bottom:5px;'>CHÚNG TA ĐI BẰNG GÌ?</div>" +
       "<div class='zh-front'><span class='hl-blue'>怎么</span>去？</div>" +
       "<div class='pinyin'>Zěnme qù?</div>" +
       "<div class='desc-front' style='font-size: 1.25em;'>" +
       "<b><span class='hl-red'>怎么 + hành động</span></b><br><br>" +
       "<b>怎么</b> nghĩa là “thế nào”, đi trước hành động để hỏi về cách làm, cách tiến hành." +
       "</div>",
    b: "<div class='desc' style='line-height:1.5;'>" +
       "<span class='zh-back'>她怎么去超市？</span><br><span class='pinyin-back'>Tā zěnme qù chāoshì?</span><span class='vi-back'>(Cô ấy đi siêu thị bằng gì?)</span>" +
       "</div>"
  },
  {
    f: "<div style='text-align:center; width:100%; font-size:1.6em; font-weight:bold; margin-bottom:5px;'>SỐ ĐIỆN THOẠI CỦA BẠN LÀ BAO NHIÊU?</div>" +
       "<div class='zh-front'>你的电话号是<span class='hl-blue'>多少</span>？</div>" +
       "<div class='pinyin'>Nǐ de diànhuà hào shì duōshao?</div>" +
       "<div class='desc-front' style='font-size: 1.15em;'>" +
       "• <b>电话</b> dùng để nói về cả điện thoại di động, không chỉ riêng điện thoại bàn.<br>" +
       "• Số điện thoại được đọc từng chữ số một.<br>" +
       "• Số 1 trong số điện thoại được đọc là <b>yāo</b> (không phải yī)." +
       "</div>",
    b: "<div class='desc' style='line-height:1.4;'>" +
       "<span class='zh-back'>你的手机号是多少？</span><br><span class='pinyin-back'>Nǐ de shǒujī hào shì duōshao?</span><span class='vi-back'>(Số điện thoại di động của bạn là bao nhiêu?)</span>" +
       "<span class='zh-back'>我的手机号是 +86 13552721160。</span><br><span class='pinyin-back'>Wǒ de shǒujī hào shì +86 13552721160.</span><span class='vi-back'>(Số điện thoại di động của tôi là +86 13552721160.)</span>" +
       "<span class='zh-back'>你家WIFI密码是多少？</span><br><span class='pinyin-back'>Nǐ jiā WIFI mìmǎ shì duōshao?</span><span class='vi-back'>(Mật khẩu wifi nhà bạn là gì?)</span>" +
       "</div>"
  }
];

let idx = 0;

function render() {
  document.getElementById('frontFace').innerHTML = cards[idx].f;
  document.getElementById('backFace').innerHTML = cards[idx].b;
  document.getElementById('progress').innerText = `Thẻ ${idx + 1} / ${cards.length}`;
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}

function nextCard() {
  idx = (idx + 1) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function prevCard() {
  idx = (idx - 1 + cards.length) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    nextCard();
    event.preventDefault();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    prevCard();
    event.preventDefault();
  } else if (event.key === ' ' || event.key === 'Enter') {
    flipCard();
    event.preventDefault();
  }
});

render();
</script>
</body>
</html>
